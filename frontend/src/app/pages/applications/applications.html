<h1>My Applications</h1>

<section class="saved-jobs">
  @for (application of applications(); track application.jobId) {
    <div class="saved-job" data-testid="saved-job">
      <app-job-card [job]="application.job" />
      <select
        class="status-select"
        data-testid="status-select"
        [value]="application.status"
        (change)="changeStatus(application.jobId, $any($event.target).value)"
      >
        @for (status of statuses; track status) {
          <option [value]="status" [selected]="status === application.status">{{ status }}</option>
        }
      </select>
    </div>
  } @empty {
    <p class="empty" data-testid="no-applications">You haven't saved any jobs yet.</p>
  }
</section>
