<a class="back-link" routerLink="/jobs">← Back to jobs</a>

@if (isLoading()) {
  <p class="not-found" data-testid="job-loading">Loading job...</p>
} @else if (job(); as job) {
  <article class="job-details" data-testid="job-details">
    <h1 data-testid="job-title">{{ job.title }}</h1>
    <p class="company">{{ job.company }}</p>

    <dl class="meta">
      <dt>Location</dt>
      <dd>{{ job.location }}</dd>
      <dt>Source</dt>
      <dd>{{ job.source }}</dd>
      <dt>Published</dt>
      <dd>{{ job.publishedAt }}</dd>
    </dl>

    <div class="actions">
      <a
        class="apply-button"
        data-testid="apply-button"
        [href]="job.url"
        target="_blank"
        rel="noopener"
      >
        Apply on company site
      </a>
      <button
        class="save-button"
        data-testid="save-button"
        [class.saved]="isSaved()"
        (click)="toggleSave()"
      >
        @if (isSaved()) {
          Saved ✓
        } @else {
          Save
        }
      </button>
    </div>
  </article>
} @else {
  <p class="not-found" data-testid="job-not-found">Job not found.</p>
}
